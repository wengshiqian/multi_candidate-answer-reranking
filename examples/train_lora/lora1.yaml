### model
#model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
model_name_or_path: 'D:/my_huggingface_cache/hub/models--Qwen--Qwen2.5-VL-7B-Instruct/snapshots/cc594898137f460bfe9f0759e9844b3ce807cfb5'
cache_dir: 'D:/my_huggingface_cache'
image_max_pixels: 262144
# video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
do_eval: false
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.1
lora_target: all
use_radam_borges: true
borges_smoothing: 0.85
borges_min_gradient_scale: 0.6
borges_max_gradient_scale: 1.2

dataset: PubMedVision_CLEANED
template: qwen2_vl
# 关键修复：避免截断图像占位符
cutoff_len: 8192
#max_samples: 5000
overwrite_cache: true
dataloader_num_workers: 0
packing: false
# 显式指定数据目录（可选，但推荐）
dataset_dir: 'd:/weng/llama-factory/data'
# 显式指定验证集
# eval_dataset: PubMedVision_VALIDATION
### output
# output_dir: saves/qwen2_5vl-7b/lora/sft_adamw_base
output_dir: saves/qwen2_5vl-7b/lora/sft_lora1
preprocessing_num_workers: 1
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: swanlab
use_swanlab: true
# swanlab_run_name: sft_adamw_base_lr7.5e-5
swanlab_run_name: lora1_sft_bdsadam_lr7.5e-5
### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 32
learning_rate: 7.5e-5
warmup_ratio: 0.05
max_grad_norm: 1.0
resume_from_checkpoint: null
num_train_epochs: 1
lr_scheduler_type: cosine
bf16: true
dataloader_drop_last: true
remove_unused_columns: false
ddp_timeout: 180000000
save_strategy: "epoch"
load_best_model_at_end: false
greater_is_better: false
predict_with_generate: false
compute_accuracy: false
logging_steps: 10
label_smoothing_factor: 0.05
weight_decay: 0.05
# 可选：若需要完全复现实验，再指定 betas/epsilon（不指定则用默认）
# adam_beta1: 0.9
# adam_beta2: 0.999
# adam_epsilon: 1.0e-8
