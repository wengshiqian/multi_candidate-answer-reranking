### model
model_name_or_path: 'D:/my_huggingface_cache/hub/models--Qwen--Qwen2.5-VL-7B-Instruct/snapshots/cc594898137f460bfe9f0759e9844b3ce807cfb5'
cache_dir: 'D:/my_huggingface_cache'
trust_remote_code: true
image_max_pixels: 147456

### method
stage: sft
do_train: true
finetuning_type: lora

# —— 最稳的 LoRA 配置，已避免全模型注入导致的不稳定 ——
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj

### dataset
dataset: PubMedVision_CLEANED
template: qwen2_vl
cutoff_len: 4096
max_samples: 20000
preprocessing_num_workers: 8
dataloader_num_workers: 0

### output
output_dir: saves/qwen2_5vl-7b/lora/sft_lora_25_12_1_fixed
logging_steps: 100
save_steps: 2000
save_total_limit: 4
plot_loss: true
overwrite_output_dir: true

report_to: swanlab
use_swanlab: true
swanlab_run_name: 'lora_lr5e-5_stable'

### optim
optim: adamw_bnb_8bit   # 比 fused 更稳
learning_rate: 5e-5     # 关键修复：2e-4 → 5e-5
lr_scheduler_type: cosine
warmup_ratio: 0.1        # 关键修复：0.03 → 0.1（多模态更稳定）
weight_decay: 0.0

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16   # 等效 batch = 16（必需）
num_train_epochs: 3.0             # 医学VQA至少3 epoch
bf16: true
gradient_checkpointing: true
max_grad_norm: 1.0
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
do_eval: true
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
predict_with_generate: false
do_predict: false
do_sample: false
top_p: 0.9
temperature: 0.95
