# # A4
lora_target: "q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj"
freeze_vision_tower: false
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

### dataset
dataset: PubMedVision_CLEANED
template: qwen2_vl
cutoff_len: 4096
max_samples: 18000
preprocessing_num_workers: 8
dataloader_num_workers: 0

### output
output_dir: saves/qwen2_5vl-7b/lora/A4
logging_steps: 100
save_steps: 2000
save_total_limit: 4
plot_loss: true
overwrite_output_dir: true

report_to: swanlab
use_swanlab: true
swanlab_run_name: 'A4'

### optim
optim: adamw_bnb_8bit   # 比 fused 更稳
learning_rate: 5e-5     # 关键修复：2e-4 → 5e-5
lr_scheduler_type: cosine
warmup_ratio: 0.1        # 关键修复：0.03 → 0.1（多模态更稳定）
weight_decay: 0.0

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16   # 等效 batch = 16（必需）
num_train_epochs: 4.0             # 医学VQA至少3 epoch
bf16: true
gradient_checkpointing: true
max_grad_norm: 1.0
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
do_eval: false
val_size: 0
per_device_eval_batch_size: 1
eval_strategy: "no"
# eval_steps: 500
predict_with_generate: false
do_predict: false
do_sample: false
top_p: 0.9
temperature: 0.95
