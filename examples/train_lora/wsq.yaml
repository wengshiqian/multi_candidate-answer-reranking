### model
model_name_or_path: 'D:/my_huggingface_cache/hub/models--Qwen--Qwen2.5-VL-7B-Instruct/snapshots/cc594898137f460bfe9f0759e9844b3ce807cfb5'
cache_dir: 'D:/my_huggingface_cache'
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.2
freeze_vision_tower: true
freeze_multi_modal_projector: false
freeze_language_model: false
lora_target: all
additional_target: null
# 启用 RAdam-Borges（bdsadam）
use_radam_borges: true
borges_smoothing: 0.8
borges_min_gradient_scale: 0.5
borges_max_gradient_scale: 2.0

### dataset
dataset: PubMedVision_CLEANED
eval_dataset: PubMedVision_VALIDATION
dataset_dir: 'd:/weng/llama-factory/data'
template: qwen2_vl
cutoff_len: 4096
packing: false
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 0

### output
output_dir: 'saves/qwen2_5vl-7b/lora/sft_wsq'
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: []               # 与日志一致（空列表）
use_swanlab: true
swanlab_run_name: 'qwen2_5vl_lora_sft_RAdamBorges_lr2e-4_s09_ms07_115'

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 32
learning_rate: 2.0e-4
warmup_ratio: 0.05
weight_decay: 0.0
max_grad_norm: 2.0
resume_from_checkpoint: null
num_train_epochs: 2
lr_scheduler_type: cosine
bf16: true
dataloader_drop_last: true
ddp_timeout: 180000000
# 以下字段在日志中有记录，补齐以保持一致
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 1.0e-08
seed: 42
optim: adamw_torch_fused   # 保留与日志一致（启用 borges 时不会被实际使用）
# 评估策略与生成
eval_strategy: "no"
predict_with_generate: false
per_device_eval_batch_size: 2
load_best_model_at_end: false
metric_for_best_model: eval_loss
greater_is_better: false
compute_accuracy: false
label_smoothing_factor: 0.0